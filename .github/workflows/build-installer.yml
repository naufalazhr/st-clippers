name: Build Installer
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish a GitHub release for (e.g. v0.1.1). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: mac
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Backend deps + PyInstaller
        working-directory: backend
        shell: bash
        run: |
          python -m venv .venv
          # Windows venv uses Scripts/; Unix uses bin/
          if [ -f .venv/Scripts/activate ]; then
            # shellcheck disable=SC1091
            source .venv/Scripts/activate
          elif [ -f .venv/bin/activate ]; then
            # shellcheck disable=SC1091
            source .venv/bin/activate
          else
            echo "venv activate script not found"
            exit 1
          fi
          # Always use python -m pip (works on Windows after activate)
          python -m pip install -U pip
          python -m pip install -r requirements.txt pyinstaller
          bash build_bundle.sh
          # Sanity: onedir must exist (exe name differs on Windows)
          ls -la dist/sultanclip-backend/ || ls -la dist/
          test -f dist/sultanclip-backend/sultanclip-backend.exe \
            -o -f dist/sultanclip-backend/sultanclip-backend
      - name: Smoke test frozen backend
        working-directory: backend
        shell: bash
        run: |
          if [ -f dist/sultanclip-backend/sultanclip-backend.exe ]; then
            SMOKE_BIN=dist/sultanclip-backend/sultanclip-backend.exe
          elif [ -f dist/sultanclip-backend/sultanclip-backend ]; then
            SMOKE_BIN=dist/sultanclip-backend/sultanclip-backend
          else
            echo "::error::frozen backend binary not found"
            exit 1
          fi
          "$SMOKE_BIN" --port 8099 > smoke.log 2>&1 &
          SMOKE_PID=$!
          trap 'kill $SMOKE_PID 2>/dev/null || true' EXIT
          healthy=0
          for _ in $(seq 1 45); do
            if curl -sf -m 3 http://127.0.0.1:8099/api/health >/dev/null 2>&1; then healthy=1; break; fi
            sleep 2
          done
          if [ "$healthy" != "1" ]; then
            echo "::error::frozen backend did not become healthy"
            cat smoke.log
            exit 1
          fi
          # HTTPS call through urllib is what regressed before (missing
          # encodings.idna in the bundle -> "unknown encoding: idna").
          MODELS=$(curl -sf -m 30 -X POST http://127.0.0.1:8099/api/models \
            -H 'Content-Type: application/json' \
            -d '{"base_url":"https://openrouter.ai/api/v1","api_key":""}') || true
          if ! printf '%s' "$MODELS" | grep -q '"models"'; then
            echo "::error::/api/models smoke failed (bundling regression, e.g. missing encodings.idna)"
            cat smoke.log
            exit 1
          fi
          # A localhost endpoint is the desktop default, and it regressed
          # separately from the HTTPS case above: api.py rewrote localhost ->
          # host.docker.internal unconditionally, so only remote hosts worked.
          cat > llm_stub.py <<'STUB'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer


          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = json.dumps({"data": [{"id": "smoke-model"}]}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, *args):
                  pass


          HTTPServer(("127.0.0.1", 20128), Handler).serve_forever()
          STUB
          python llm_stub.py &
          STUB_PID=$!
          trap 'kill $SMOKE_PID $STUB_PID 2>/dev/null || true' EXIT
          sleep 2
          LOCAL=$(curl -sf -m 20 -X POST http://127.0.0.1:8099/api/models             -H 'Content-Type: application/json'             -d '{"base_url":"http://localhost:20128/v1","api_key":""}') || true
          if ! printf '%s' "$LOCAL" | grep -q 'smoke-model'; then
            echo "::error::/api/models failed for a localhost endpoint (got: $LOCAL)"
            cat smoke.log
            exit 1
          fi
          SCHEMA=$(curl -sf http://127.0.0.1:8099/openapi.json) || true
          if ! printf '%s' "$SCHEMA" | grep -q '"split"'; then
            echo "::error::crop_mode 'split' missing from OpenAPI schema"
            exit 1
          fi
          HEALTH=$(curl -sf http://127.0.0.1:8099/api/health) || true
          if ! printf '%s' "$HEALTH" | grep -q '"split"'; then
            echo "::error::/api/health does not advertise the crop_mode enum"
            exit 1
          fi
          echo "Smoke OK: health+identity, /api/models over HTTPS and localhost, crop_mode includes split"
      - name: Stage backend onedir into Tauri resources
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/resources
          rm -rf desktop/src-tauri/resources/sultanclip-backend
          cp -R backend/dist/sultanclip-backend desktop/src-tauri/resources/sultanclip-backend
          ls -la desktop/src-tauri/resources/sultanclip-backend/ | head -20
          # Windows: ensure .exe is present for lib.rs lookup
          if [ -f desktop/src-tauri/resources/sultanclip-backend/sultanclip-backend.exe ]; then
            echo "Windows backend exe staged"
          elif [ -f desktop/src-tauri/resources/sultanclip-backend/sultanclip-backend ]; then
            echo "Unix backend binary staged"
          else
            echo "ERROR: backend binary missing after stage"
            exit 1
          fi
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Desktop deps
        working-directory: desktop
        run: npm ci
      - name: Tauri build
        working-directory: desktop
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "mac" ]; then
            npx tauri build --target ${{ matrix.target }}
          else
            npx tauri build
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sultanclip-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/**/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/bundle/macos/*.app
            desktop/src-tauri/target/**/bundle/msi/*.msi
            desktop/src-tauri/target/**/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            desktop/src-tauri/target/**/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/bundle/msi/*.msi
            desktop/src-tauri/target/**/bundle/nsis/*.exe
