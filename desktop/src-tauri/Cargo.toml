[package]
name = "sultan-clip"
version = "0.1.4"
edition = "2021"

[lib]
name = "sultan_clip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: MCP keeps the backend alive after the window closes, so the user
# needs a way back to the window and an explicit Quit that is not Task Manager.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
